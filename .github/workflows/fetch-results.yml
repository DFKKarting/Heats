name: Apex-resultaten ophalen

# Downloads new/revised result PDFs (see scripts/fetch_apex.py and
# data/apex/sources.json) and commits them, so the app can import them
# automatically.
#
# Each run keeps checking about every minute for ~14 minutes, then starts the
# next run itself - GitHub's own schedule (cron) is unreliable for frequent
# runs (often hours late or skipped), so it's only a fallback here to restart
# the chain if it ever breaks. Stop it via Actions -> "Disable workflow".
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Elke minuut resultaten ophalen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 14 * 60))
          while [ $SECONDS -lt $end ]; do
            git pull -q --rebase origin master || true
            python3 scripts/fetch_apex.py || echo "Ophalen mislukt, volgende poging over een minuut."
            git add data/apex
            if ! git diff --cached --quiet; then
              git commit -m "Apex-resultaten bijgewerkt"
              git pull --rebase origin master
              git push
            fi
            sleep 45
          done

      - name: Volgende run starten
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fetch-results.yml --ref master
