<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Karting Klassement</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="top-banner">
  <img src="DFK ZWT.png" alt="DFK Kart Racing Team" />
</div>
<p class="subtitle">Upload heat-resultaten (PDF) en krijg automatisch een opgeteld klassement per klasse.</p>

<main>
  <section class="panel" id="upload-card">
    <h2>Upload</h2>
    <div id="dropzone" class="dropzone">
      <p><strong>Sleep PDF's hierheen</strong> of klik om te kiezen</p>
      <p class="hint">Je kan meerdere heats tegelijk selecteren.</p>
      <input type="file" id="fileInput" accept="application/pdf" multiple hidden />
    </div>
    <div id="parseStatus" class="status"></div>
  </section>

  <section class="panel" id="heats-card">
    <div class="panel-header">
      <button id="toggleHeatsBtn" class="panel-toggle" type="button" aria-expanded="false">
        <span class="chevron">▸</span> <h2 style="display:inline">Geladen heats</h2>
      </button>
      <button id="resetBtn" class="btn-outline" type="button">Alles wissen</button>
    </div>
    <div id="heatsList" class="heats-list collapsed">
      <p class="empty-hint">Nog geen heats geladen.</p>
    </div>
  </section>

  <section class="panel" id="highlighted-card">
    <h2>Gevolgde rijders</h2>
    <div id="highlightedContainer">
      <p class="empty-hint">Nog geen rijders gehighlight. Klik op een ster om een rijder te volgen.</p>
    </div>
  </section>

  <section id="classification-area">
    <div id="search-card">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Zoek rijder..." autocomplete="off" />
      <div id="searchResults" class="search-results"></div>
    </div>
    <div id="classificationsContainer"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
